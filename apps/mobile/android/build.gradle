buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 24
        compileSdkVersion = 33
        targetSdkVersion = 33
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

apply plugin: "com.android.application"

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ojowacam.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
    signingConfigs {
        release {
            storeFile file(System.env.ANDROID_KEYSTORE_PATH ?: "ojowacam-upload-keystore.jks")
            storePassword System.env.ANDROID_KEYSTORE_PASSWORD
            keyAlias "upload"
            keyPassword System.env.ANDROID_KEY_PASSWORD
        }
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // React Native and WebRTC dependencies are managed through Expo SDK,
    // not as direct Gradle dependencies in this native module directory
}

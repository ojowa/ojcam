def minSdkVersion = 24
def compileSdkVersion = 33
def targetSdkVersion = 33

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

apply plugin: "com.android.application"

def hasReleaseSigning = System.env.ANDROID_KEYSTORE_PASSWORD != null

android {
    compileSdkVersion compileSdkVersion

    defaultConfig {
        applicationId "com.ojowacam.mobile"
        minSdkVersion minSdkVersion
        targetSdkVersion targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv("ANDROID_HOME") != null ? 
                file("${System.getenv("ANDROID_HOME")}/.android/debug.keystore") :
                file("debug.keystore"))
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(System.env.ANDROID_KEYSTORE_PATH ?: "ojowacam-upload-keystore.jks")
                storePassword System.env.ANDROID_KEYSTORE_PASSWORD
                keyAlias "upload"
                keyPassword System.env.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // React Native and WebRTC dependencies are managed through Expo SDK,
    // not as direct Gradle dependencies in this native module directory
}

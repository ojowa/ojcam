buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 24
        compileSdkVersion = 33
        targetSdkVersion = 33
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
    }
}

apply plugin: "com.android.application"

def hasReleaseSigning = System.env.ANDROID_KEYSTORE_PASSWORD != null

android {
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.ojowacam.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        // Debug builds rely on AGP's auto-generated debug keystore
        // ($ANDROID_HOME/.android/debug.keystore). An explicit debug
        // signing config pointing at a relative debug.keystore file would
        // fail in CI where no such file is checked in.
        if (hasReleaseSigning) {
            release {
                storeFile file(System.env.ANDROID_KEYSTORE_PATH ?: "ojowacam-upload-keystore.jks")
                storePassword System.env.ANDROID_KEYSTORE_PASSWORD
                keyAlias "upload"
                keyPassword System.env.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    // React Native and WebRTC dependencies are managed through Expo SDK,
    // not as direct Gradle dependencies in this native module directory
}

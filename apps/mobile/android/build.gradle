buildscript {
    ext.kotlin_version = '1.8.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.ojowacam.mobile"
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file(System.getenv("ANDROID_HOME") != null ? 
                file("${System.getenv("ANDROID_HOME")}/.android/debug.keystore") :
                file("debug.keystore"))
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        if (System.env.ANDROID_KEYSTORE_PASSWORD != null) {
            release {
                storeFile file(System.env.ANDROID_KEYSTORE_PATH ?: "ojowacam-upload-keystore.jks")
                storePassword System.env.ANDROID_KEYSTORE_PASSWORD
                keyAlias "upload"
                keyPassword System.env.ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (System.env.ANDROID_KEYSTORE_PASSWORD != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets {
        main {
            java.srcDirs += 'src/main/java'
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
android {
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (project.hasProperty('OJO_RELEASE_STORE_FILE')) {
                storeFile file(project.OJO_RELEASE_STORE_FILE)
                storePassword project.OJO_RELEASE_STORE_PASSWORD
                keyAlias project.OJO_RELEASE_KEY_ALIAS
                keyPassword project.OJO_RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            zipAlignEnabled true
            shrinkResources true
        }
    }
    
    // Configure ABI splits for smaller APKs
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }
}

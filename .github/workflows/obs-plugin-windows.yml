name: OBS Plugin Build - Windows

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OBS_VERSION: '30.1.2'

jobs:
  obs-plugin-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --allowemptychecksums -y
          }
          Write-Host "CMake version: $(cmake --version | Select-Object -First 1)"

      - name: Install OBS dependencies
        shell: pwsh
        run: |
          $depsVersion = '2024-03-19'
          $depsArchive = Join-Path $env:RUNNER_TEMP "windows-deps-$depsVersion-x64.zip"
          $depsPath = Join-Path $env:RUNNER_TEMP 'obs-deps'
          Invoke-WebRequest `
            -Uri "https://github.com/obsproject/obs-deps/releases/download/$depsVersion/windows-deps-$depsVersion-x64.zip" `
            -OutFile $depsArchive
          Expand-Archive -Path $depsArchive -DestinationPath $depsPath
          Add-Content -Path $env:GITHUB_ENV -Value "OBS_DepsPath64=$depsPath"

      - name: Clone OBS Studio SDK
        run: |
          git clone --depth 1 --shallow-submodules --recurse-submodules --branch ${{ env.OBS_VERSION }} https://github.com/obsproject/obs-studio.git obs-studio

      - name: Resolve Direct3D compiler library
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'ci-libs'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $generatedLib = Join-Path $outDir 'd3dcompiler_47.lib'
          $patchTarget = $null

          # Preferred: build a minimal import lib from the system d3dcompiler_47.dll
          # (guaranteed to export D3DCompile/D3DCreateBlob; path has no spaces).
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $libExe = $null
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if ($vsPath) {
              $libExe = Get-ChildItem -Path (Join-Path $vsPath 'VC\Tools\MSVC') -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                ForEach-Object { Join-Path $_.FullName 'bin\Hostx64\x64\lib.exe' } |
                Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          }
          $defFile = Join-Path $outDir 'd3dcompiler_47.def'
          @('LIBRARY d3dcompiler_47', 'EXPORTS', '    D3DCompile', '    D3DCreateBlob') | Set-Content -Path $defFile -Encoding ascii
          if ($libExe) {
            & $libExe /nologo /def:$defFile /machine:x64 /out:$generatedLib
            if ($LASTEXITCODE -eq 0 -and (Test-Path $generatedLib)) {
              $patchTarget = $generatedLib
              Write-Host "Generated import lib via lib.exe: $generatedLib"
            } else {
              Write-Host "lib.exe failed (exit $LASTEXITCODE); falling back to SDK search"
            }
          } else {
            Write-Host "lib.exe not found via vswhere; falling back to SDK search"
          }

          if (-not $patchTarget) {
            $sdkLibRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
            $candidates = @()
            if (Test-Path $sdkLibRoot) {
              $candidates = @(
                Get-ChildItem -Path $sdkLibRoot -Filter d3dcompiler_47.lib -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\um\\x64\\d3dcompiler_47\.lib$' } |
                  Sort-Object { try { [version]$_.Directory.Parent.Parent.Name } catch { [version]'0.0.0.0' } } -Descending |
                  Select-Object -First 1
                Get-ChildItem -Path $sdkLibRoot -Filter d3dcompiler.lib -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match '\\um\\x64\\d3dcompiler\.lib$' } |
                  Sort-Object { try { [version]$_.Directory.Parent.Parent.Name } catch { [version]'0.0.0.0' } } -Descending |
                  Select-Object -First 1
              ) | Where-Object { $_ }
            }
            if ($candidates) { $patchTarget = $candidates[0].FullName }
          }

          if (-not $patchTarget) {
            Write-Host "No d3dcompiler lib available to patch; relying on the Visual Studio toolset default library path."
            exit 0
          }

          $libraryPath = $patchTarget.Replace('\', '/')
          $replacement = 'target_link_libraries(libobs-d3d11 PRIVATE OBS::libobs d3d9 d3d11 "' + $libraryPath + '" dxgi shcore)'
          $patchJobs = @(
            @{ File = 'obs-studio/libobs-d3d11/cmake/legacy.cmake'; Original = 'target_link_libraries(libobs-d3d11 PRIVATE OBS::libobs d3d9 d3d11 dxgi shcore)'; Required = $true },
            @{ File = 'obs-studio/libobs-d3d11/CMakeLists.txt'; Original = 'target_link_libraries(libobs-d3d11 PRIVATE OBS::libobs d3d9 d3d11 d3dcompiler dxgi shcore)'; Required = $false }
          )
          foreach ($job in $patchJobs) {
            if (-not (Test-Path $job.File)) { Write-Host "Missing $($job.File); skipping"; continue }
            $contents = Get-Content -Raw $job.File
            if (-not $contents.Contains($job.Original)) {
              if ($job.Required) { throw "Expected link line not found in $($job.File)" }
              Write-Host "Link line not found in $($job.File); skipping"
              continue
            }
            $contents = $contents.Replace($job.Original, $replacement)
            Set-Content -Path $job.File -Value $contents -NoNewline
            Write-Host "Patched $($job.File)"
            Select-String -Path $job.File -Pattern 'target_link_libraries\(libobs-d3d11' | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
          }
          Write-Host "Using Direct3D compiler library: $patchTarget"

      - name: Configure OBS Studio (Windows)
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-studio/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF -DENABLE_SCRIPTING=OFF -DENABLE_STREAMFX=OFF -DENABLE_SPEECH_TO_TEXT=OFF -DENABLE_VST=OFF -DENABLE_WEBRTC=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vcx = Get-ChildItem obs-studio/build/libobs-d3d11 -Filter 'libobs-d3d11.vcxproj' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vcx) {
            Write-Host "=== d3dcompiler references in $($vcx.Name) ==="
            Select-String -Path $vcx.FullName -Pattern 'd3dcompiler' | ForEach-Object { Write-Host $_.Line.Trim() }
          }
          Write-Host "OBS configure complete"

      - name: Build OBS runtime libraries (Windows)
        shell: pwsh
        run: |
          cmake --build obs-studio/build --config Release -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "OBS runtime libraries build complete"

      - name: Install OBS to local prefix (Windows)
        shell: pwsh
        run: |
          $env:OBS_INSTALL_PREFIX = "$env:GITHUB_WORKSPACE/obs-install"
          cmake --install obs-studio/build --prefix $env:OBS_INSTALL_PREFIX --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "OBS installed to $env:OBS_INSTALL_PREFIX"

      - name: Stage OBS headers and import lib for plugin
        shell: pwsh
        run: |
          # cmake --install skips the Development component (headers + OBSConfig),
          # so stage what the plugin CMakeLists manual fallback expects:
          #   .deps/obs-studio/libobs  (headers) and .deps/obs-lib/obs.lib
          New-Item -ItemType Directory -Force -Path .deps/obs-studio | Out-Null
          Copy-Item -Recurse obs-studio/libobs .deps/obs-studio/libobs
          New-Item -ItemType Directory -Force -Path .deps/obs-lib | Out-Null
          Copy-Item obs-install/bin/64bit/obs.lib .deps/obs-lib/obs.lib
          if (-not (Test-Path .deps/obs-studio/libobs/obs-module.h)) { throw 'obs-module.h staging failed' }
          if (-not (Test-Path .deps/obs-lib/obs.lib)) { throw 'obs.lib staging failed' }
          Write-Host "Staged OBS development files into .deps/"

      - name: Validate OBS installation (Windows)
        shell: pwsh
        run: |
          $env:OBS_INSTALL_PREFIX = "$env:GITHUB_WORKSPACE/obs-install"
          Write-Host "=== OBS Install Tree ==="
          Get-ChildItem -Recurse $env:OBS_INSTALL_PREFIX | Select-Object -First 50
          Write-Host "=== Checking for OBS CMake config ==="
          $configPaths = @(
            "$env:OBS_INSTALL_PREFIX/lib/cmake/OBS/OBSConfig.cmake",
            "$env:OBS_INSTALL_PREFIX/lib64/cmake/OBS/OBSConfig.cmake",
            "$env:OBS_INSTALL_PREFIX/share/cmake/OBS/OBSConfig.cmake"
          )
          $found = $false
          foreach ($p in $configPaths) {
            if (Test-Path $p) {
              Write-Host "FOUND: $p"
              $found = $true
            }
          }
          if (-not $found) {
            Write-Host "WARNING: No OBS CMake config package found. Plugin will use manual detection fallback."
          }
          Write-Host "=== OBS Headers ==="
          Get-ChildItem -Path "$env:OBS_INSTALL_PREFIX/include" -Recurse -Filter "*.h" | Select-Object -First 20
          Write-Host "=== OBS Libraries ==="
          Get-ChildItem -Path "$env:OBS_INSTALL_PREFIX/lib" -Recurse -Filter "*.lib" -ErrorAction SilentlyContinue
          Get-ChildItem -Path "$env:OBS_INSTALL_PREFIX/bin" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue

      - name: Configure Ojowacam OBS Plugin (Windows)
        shell: pwsh
        run: |
          $env:CMAKE_PREFIX_PATH = "$env:GITHUB_WORKSPACE/obs-install"
          cmake -S apps/obs-plugin-windows -B apps/obs-plugin-windows/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Ojowacam plugin configure complete"

      - name: Build Ojowacam OBS Plugin (Windows)
        shell: pwsh
        run: |
          cmake --build apps/obs-plugin-windows/build --config Release --target ojowacam-obs -j 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Ojowacam plugin build complete"

      - name: Code sign Windows OBS Plugin (Authenticode)
        if: env.WINDOWS_SIGNING_CERT != ''
        env:
          WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = "$env:RUNNER_TEMP/ojowacam-signing-cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          $dllPath = Get-ChildItem -Path "apps/obs-plugin-windows/build/package/bin/64bit" -Filter "ojowacam-obs.dll" -Recurse | Select-Object -First 1
          if ($dllPath) {
            & signtool sign /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /t http://timestamp.digicert.com /v $dllPath.FullName
            Write-Host "Windows OBS plugin signed successfully"
          } else {
            Write-Host "No DLL found to sign"
          }

      - name: Build Ojowacam OBS Plugin MSI
        shell: pwsh
        run: |
          $pluginOutput = Join-Path $env:GITHUB_WORKSPACE 'apps/obs-plugin-windows/build/package'
          $pluginDll = Join-Path $pluginOutput 'bin/64bit/ojowacam-obs.dll'
          $moduleJson = Join-Path $pluginOutput 'data/module.json'
          if (-not (Test-Path $pluginDll)) { throw 'OBS plugin DLL was not built.' }
          if (-not (Test-Path $moduleJson)) { throw 'OBS plugin module.json was not generated.' }
          $pluginStage = Join-Path $env:RUNNER_TEMP 'ojowacam-obs-plugin-msi'
          New-Item -ItemType Directory -Force -Path (Join-Path $pluginStage 'bin/64bit') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $pluginStage 'data') | Out-Null
          Copy-Item -LiteralPath $pluginDll -Destination (Join-Path $pluginStage 'bin/64bit/ojowacam-obs.dll')
          Copy-Item -LiteralPath $moduleJson -Destination (Join-Path $pluginStage 'data/module.json')
          candle.exe "-dPluginDir=$pluginStage" -out apps/obs-plugin-windows/build/ojowacam-obs-plugin.wixobj apps/obs-plugin-windows/installers/ojowacam-obs-plugin.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          light.exe -out apps/obs-plugin-windows/build/Ojowacam.ObsPlugin.msi apps/obs-plugin-windows/build/ojowacam-obs-plugin.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Ojowacam OBS Plugin MSI (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-obs-windows
          path: apps/obs-plugin-windows/build/Ojowacam.ObsPlugin.msi

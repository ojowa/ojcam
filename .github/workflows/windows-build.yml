name: Windows Desktop Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install WiX Toolset for MSI building
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y
          }
          Write-Host "WiX toolset installed"
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows dependencies
        run: |
          dotnet restore apps/desktop-windows/Ojowacam.Desktop.csproj
      - name: Build Windows application
        run: |
          dotnet build apps/desktop-windows/Ojowacam.Desktop.csproj -c Release
      - name: Publish Windows application (self-contained .exe)
        run: |
          dotnet publish apps/desktop-windows/Ojowacam.Desktop.csproj -c Release -o ./publish -r win-x64 --self-contained
      - name: Publish Windows application (single-file portable exe)
        run: |
          dotnet publish apps/desktop-windows/Ojowacam.Desktop.csproj -c Release -o ./publish-single -r win-x64 --self-contained -p:PublishSingleFile=true
      - name: Upload Windows publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-windows-publish
          path: publish/
      - name: Build Windows MSI installer
        shell: pwsh
        run: |
          $installerDir = 'apps/obs-plugin-windows/installers'
          $workDir = Join-Path $env:RUNNER_TEMP 'desktop-msi'
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'publish'
          heat.exe dir publish -cg DesktopPublishFiles -dr INSTALLFOLDER -srd -scom -sreg -ag -t "$installerDir/desktop-publish-x64.xsl" -var var.PublishDir -out "$workDir/desktop-publish-files.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          candle.exe "-dPublishDir=$publishDir" -ext WixUIExtension -out "$workDir/ojowacam-desktop.wixobj" "$installerDir/ojowacam-desktop.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          candle.exe "-dPublishDir=$publishDir" -out "$workDir/desktop-publish-files.wixobj" "$workDir/desktop-publish-files.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msiPath = Join-Path $workDir 'Ojowacam.Desktop.msi'
          light.exe -ext WixUIExtension -out $msiPath "$workDir/ojowacam-desktop.wixobj" "$workDir/desktop-publish-files.wixobj"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "MSI_PATH=$msiPath"
      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-windows-msi
          path: ${{ env.MSI_PATH }}
      - name: Upload Windows single-file portable exe
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-windows-exe
          path: publish-single/Ojowacam.Desktop.exe
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-windows-build
          path: apps/desktop-windows/bin/Release/

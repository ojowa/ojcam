name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_VERSION: '17'
  OBS_VERSION: '30.1.2'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
          cd apps/mobile && npm install
      - name: Lint Android code
        run: |
          cd apps/mobile/android && ./gradlew lint
      - name: Build Android APK
        run: |
          cd apps/mobile/android && ./gradlew assembleDebug
      - name: Run Android unit tests
        run: |
          cd apps/mobile/android && ./gradlew testDebugUnitTest
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Windows dependencies
        run: |
          dotnet restore apps/desktop-windows/Ojowacam.Desktop.csproj
      - name: Build Windows application
        run: |
          dotnet build apps/desktop-windows/Ojowacam.Desktop.csproj -c Release
      - name: Run Windows unit tests
        run: |
          dotnet test apps/desktop-windows/Ojowacam.Desktop.csproj -c Release --no-build
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-windows-build
          path: apps/desktop-windows/bin/Release/

  macos-build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.app/Contents/Developer
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
          cd apps/mobile && npm install
      - name: Build macOS companion
        run: |
          cd apps/desktop-macos && swift build -c release
      - name: Build OBS plugin (macOS)
        run: |
          cd apps/obs-plugin/macos-plugin && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release && make -j$(sysctl -n hw.ncpu)
      - name: Run macOS unit tests
        run: |
          cd apps/desktop-macos && swift test
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-macos-build
          path: apps/desktop-macos/.build/release/

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install CMake and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libobs-dev libwebrtc-dev
      - name: Configure CMake
        run: |
          cd packages/streaming-core && mkdir -p build && cd build && cmake .. -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ streaming core
        run: |
          cd packages/streaming-core/build && make -j$(nproc)
      - name: Run C++ tests
        run: |
          cd packages/streaming-core/build && ctest --output-on-failure

  obs-plugin-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ojowacam-obs-windows
            cmake_generator: '-G "Visual Studio 17 2022" -A x64'
            shell: pwsh
          - os: macos-latest
            artifact_name: ojowacam-obs-macos
            cmake_generator: '-G "Unix Makefiles"'
            shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --allowemptychecksums -y
          }
          Write-Host "CMake version: $(cmake --version | Select-Object -First 1)"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja qt@6 ffmpeg curl libuv python3

      - name: Clone OBS Studio SDK
        run: |
          git clone --depth 1 --branch ${{ env.OBS_VERSION }} https://github.com/obsproject/obs-studio.git obs-studio

      - name: Configure OBS Studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S obs-studio -B obs-studio/build ${{ matrix.cmake_generator }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_OBS=OFF `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_STREAMFX=OFF `
            -DENABLE_SPEECH_TO_TEXT=OFF `
            -DENABLE_VST=OFF `
            -DENABLE_WEBRTC=OFF
          Write-Host "OBS configure complete"

      - name: Configure OBS Studio (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S obs-studio -B obs-studio/build ${{ matrix.cmake_generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_OBS=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_STREAMFX=OFF \
            -DENABLE_SPEECH_TO_TEXT=OFF \
            -DENABLE_VST=OFF \
            -DENABLE_WEBRTC=OFF
          echo "OBS configure complete"

      - name: Build OBS libobs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build obs-studio/build --config Release --target obs -j 4
          Write-Host "OBS build complete"

      - name: Build OBS libobs (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --build obs-studio/build --target obs -j $(sysctl -n hw.ncpu)
          echo "OBS build complete"

      - name: Install OBS to local prefix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OBS_INSTALL_PREFIX = "$env:GITHUB_WORKSPACE/obs-install"
          cmake --install obs-studio/build --prefix $env:OBS_INSTALL_PREFIX --config Release
          Write-Host "OBS installed to $env:OBS_INSTALL_PREFIX"

      - name: Install OBS to local prefix (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export OBS_INSTALL_PREFIX="$GITHUB_WORKSPACE/obs-install"
          cmake --install obs-studio/build --prefix $OBS_INSTALL_PREFIX
          echo "OBS installed to $OBS_INSTALL_PREFIX"

      - name: Configure Ojowacam OBS Plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OBS_INSTALL_PREFIX = "$env:GITHUB_WORKSPACE/obs-install"
          cmake -S apps/obs-plugin -B apps/obs-plugin/build ${{ matrix.cmake_generator }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH=$env:OBS_INSTALL_PREFIX
          Write-Host "Ojowacam plugin configure complete"

      - name: Configure Ojowacam OBS Plugin (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export OBS_INSTALL_PREFIX="$GITHUB_WORKSPACE/obs-install"
          cmake -S apps/obs-plugin -B apps/obs-plugin/build ${{ matrix.cmake_generator }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$OBS_INSTALL_PREFIX
          echo "Ojowacam plugin configure complete"

      - name: Build Ojowacam OBS Plugin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build apps/obs-plugin/build --config Release --target ojowacam-obs -j 4
          Write-Host "Ojowacam plugin build complete"

      - name: Build Ojowacam OBS Plugin (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake --build apps/obs-plugin/build -j $(sysctl -n hw.ncpu)
          echo "Ojowacam plugin build complete"

      - name: Upload Windows OBS Plugin artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/obs-plugin/build/**/*.dll
            apps/obs-plugin/build/**/*.pdb
            apps/obs-plugin/build/**/*.lib
            apps/obs-plugin/build/**/*.exp

      - name: Upload macOS OBS Plugin artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/obs-plugin/build/**/*.bundle
            apps/obs-plugin/build/**/*.dylib

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run dependency vulnerability scan
        uses: actions/npm audit@v1
        with:
          args: --audit-level=high
      - name: Run SAST scan (CodeQL)
        uses: github/codeql-action/analyze@v3
        with:
          languages: ['csharp', 'javascript', 'swift', 'kotlin', 'cpp']

  release:
    needs: [android-build, windows-build, macos-build, cpp-build, obs-plugin-build, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ojowacam-android-apk/app-debug.apk
            artifacts/ojowacam-windows-build/**
            artifacts/ojowacam-macos-build/**
            artifacts/ojowacam-obs-windows/**
            artifacts/ojowacam-obs-macos/**
          generate_release_notes: true

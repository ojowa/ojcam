name: OBS Plugin Build - macOS

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OBS_VERSION: '33.0.1'

jobs:
  obs-plugin-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          brew update
          # libobs (OBS 33) hard-requires FFmpeg >= 8.0, jansson, SIMDe and
          # uthash. pkg-config lets OBS's finders resolve them under the
          # Homebrew prefix, which is not a default CMake search path.
          brew install cmake ffmpeg jansson simde uthash pkg-config

      - name: Clone OBS Studio SDK
        run: |
          git clone --depth 1 --shallow-submodules --recurse-submodules --branch ${{ env.OBS_VERSION }} https://github.com/obsproject/obs-studio.git obs-studio

      - name: Configure OBS Studio (macOS)
        run: |
          # OBS 33 hard-requires the Xcode generator on macOS (and
          # Xcode >= 26.5, which macos-latest ships). Expose the Homebrew
          # prefix so libobs finds FFmpeg, jansson, SIMDe and uthash.
          export CMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake -S obs-studio -B obs-studio/build -G Xcode \
            -DENABLE_FRONTEND=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_CORE_MODULES=OFF
          if [ $? -ne 0 ]; then exit 1; fi
          echo "OBS configure complete"

      - name: Build libobs (macOS)
        run: |
          # The plugin only compiles and links against libobs; renderers,
          # frontend and core modules are deliberately not built.
          cmake --build obs-studio/build --config Release --target libobs -j $(sysctl -n hw.ncpu)
          if [ $? -ne 0 ]; then exit 1; fi
          echo "libobs build complete"

      - name: Stage OBS SDK for plugin
        run: |
          # Stage what the plugin's manual detection fallback expects:
          #   <prefix>/include/obs/*.h  and  <prefix>/Frameworks/libobs.framework
          # cmake --install is skipped on purpose: on macOS the framework and
          # its headers install under component obs_libraries marked
          # EXCLUDE_FROM_ALL, and driving that would mean building the whole
          # OBS project instead of just libobs.
          OBS_INSTALL_PREFIX="$GITHUB_WORKSPACE/obs-install"
          mkdir -p "$OBS_INSTALL_PREFIX/include/obs"
          if [ ! -f "$OBS_INSTALL_PREFIX/include/obs/obs-module.h" ]; then
            cp -R obs-studio/libobs/. "$OBS_INSTALL_PREFIX/include/obs/"
          fi
          test -f "$OBS_INSTALL_PREFIX/include/obs/obs-module.h"
          mkdir -p "$OBS_INSTALL_PREFIX/Frameworks"
          FW=$(find obs-studio/build -type d -name "libobs.framework" | head -1)
          if [ -z "$FW" ]; then
            echo "libobs.framework not found in the OBS build tree"
            find obs-studio/build -maxdepth 3 -type d | head -50
            exit 1
          fi
          rm -rf "$OBS_INSTALL_PREFIX/Frameworks/libobs.framework"
          cp -R "$FW" "$OBS_INSTALL_PREFIX/Frameworks/"
          echo "=== staged OBS SDK ==="
          find "$OBS_INSTALL_PREFIX" \( -name "libobs*" -o -name "obs-module.h" \) | head -20

      - name: Configure Ojowacam OBS Plugin (macOS)
        run: |
          cmake -S apps/obs-plugin-macos -B apps/obs-plugin-macos/build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-install"
          if [ $? -ne 0 ]; then exit 1; fi
          echo "Ojowacam plugin configure complete"

      - name: Build Ojowacam OBS Plugin (macOS)
        run: |
          cmake --build apps/obs-plugin-macos/build -j $(sysctl -n hw.ncpu)
          if [ $? -ne 0 ]; then exit 1; fi
          echo "Ojowacam plugin build complete"

      - name: Code sign and notarize macOS OBS Plugin
        if: env.APPLE_DEVELOPER_ID != ''
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          BUNDLE_PATH=$(find apps/obs-plugin-macos/build/data/obs-plugins/ojowacam-obs -name "*.bundle" -type d | head -1)
          if [ -n "$BUNDLE_PATH" ]; then
            codesign --deep --force --sign "$APPLE_DEVELOPER_ID" "$BUNDLE_PATH"
            echo "macOS OBS plugin signed"

            xcrun notarytool submit "$BUNDLE_PATH" \
              --apple-id "$APPLE_NOTARY_APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_NOTARY_PASSWORD" \
              --wait
            echo "macOS OBS plugin notarized"

            xcrun stapler staple "$BUNDLE_PATH"
            echo "macOS OBS plugin stapled"
          else
            echo "No bundle found to sign"
          fi

      - name: Upload macOS OBS Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-obs-macos
          if-no-files-found: error
          path: |
            apps/obs-plugin-macos/build/data/obs-plugins/ojowacam-obs/**/*.bundle
            apps/obs-plugin-macos/build/data/obs-plugins/ojowacam-obs/**/*.dylib

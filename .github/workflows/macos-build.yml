name: macOS Desktop Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-build:
    runs-on: macos-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
          cd apps/mobile-ios && npm install
      - name: Build macOS companion
        run: |
          cd apps/desktop-macos && swift build -c release
      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-macos-build
          path: apps/desktop-macos/.build/release/

name: iOS Build

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install mobile dependencies
        run: |
          cd apps/mobile-ios && npm install
      - name: Install CocoaPods
        run: |
          gem install cocoapods
      - name: Install iOS pods
        run: |
          cd apps/mobile-ios/ios && pod install
      - name: Create iOS export options plist
        run: |
          cat > apps/mobile-ios/ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>method</key>
              <string>ad hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>thinning</key>
              <string>&lt;thin-for-all-variants&gt;</string>
          </dict>
          </plist>
          EOF
      - name: Build iOS app (archive)
        run: |
          cd apps/mobile-ios/ios
          xcodebuild -project Ojowacam.xcodeproj -scheme Ojowacam -configuration Release -sdk iphoneos -archivePath build/Ojowacam.xcarchive archive
      - name: Export iOS IPA
        run: |
          cd apps/mobile-ios/ios
          xcodebuild -exportArchive -archivePath build/Ojowacam.xcarchive -exportPath build/ipa -exportOptionsPlist ExportOptions.plist
      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-ios-ipa
          path: apps/mobile-ios/ios/build/ipa/*.ipa
          if-no-files-found: continue

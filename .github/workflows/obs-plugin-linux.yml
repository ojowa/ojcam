name: OBS Plugin Build - Linux

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OBS_VERSION: '33.0.1'

jobs:
  obs-plugin-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Note: "qt6-base" is not an Ubuntu package name (and the UI is
          # disabled anyway). libobs in OBS 33 hard-requires FFmpeg >= 8.0,
          # SIMDe, uthash, jansson and zlib; cmake/linux/defaults.cmake
          # requires ECM (Extra CMake Modules); libobs-opengl's configure
          # step (which always runs) pulls in deps/glad, whose
          # find_package(OpenGL REQUIRED) needs glvnd's libgl-dev and
          # libglx-dev (plus libdrm/X11/XCB); PulseAudio keeps the default
          # ENABLE_PULSEAUDIO=ON satisfied; avahi/opus are for the plugin's
          # own device discovery and audio decode.
          sudo apt-get install -y cmake build-essential pkg-config \
            extra-cmake-modules \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libjansson-dev uthash-dev libsimde-dev zlib1g-dev \
            libdrm-dev libx11-dev libxcb1-dev libx11-xcb-dev libgl-dev libglx-dev \
            libpulse-dev \
            libavahi-client-dev libopus-dev

      - name: Clone OBS Studio SDK
        run: |
          git clone --depth 1 --shallow-submodules --recurse-submodules --branch ${{ env.OBS_VERSION }} https://github.com/obsproject/obs-studio.git obs-studio

      - name: Configure OBS Studio (Linux)
        run: |
          cmake -S obs-studio -B obs-studio/build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_FRONTEND=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_CORE_MODULES=OFF \
            -DENABLE_WAYLAND=OFF
          if [ $? -ne 0 ]; then exit 1; fi
          echo "OBS configure complete"

      - name: Build libobs (Linux)
        run: |
          # The plugin only compiles and links against libobs; renderers,
          # frontend and core modules are deliberately not built.
          cmake --build obs-studio/build --target libobs -j $(nproc)
          if [ $? -ne 0 ]; then exit 1; fi
          echo "libobs build complete"

      - name: Stage OBS SDK for plugin
        run: |
          # Stage what the plugin's manual detection fallback expects:
          #   <prefix>/include/obs/*.h  and  <prefix>/lib/libobs.so*
          # (cmake --install is skipped: OBS attaches headers/libraries to
          # EXCLUDE_FROM_ALL components, and driving those would mean
          # building the whole OBS project instead of just libobs.)
          OBS_INSTALL_PREFIX="$GITHUB_WORKSPACE/obs-install"
          mkdir -p "$OBS_INSTALL_PREFIX/include/obs" "$OBS_INSTALL_PREFIX/lib"
          if [ ! -f "$OBS_INSTALL_PREFIX/include/obs/obs-module.h" ]; then
            cp -R obs-studio/libobs/. "$OBS_INSTALL_PREFIX/include/obs/"
          fi
          test -f "$OBS_INSTALL_PREFIX/include/obs/obs-module.h"
          # obs-config.h does #include "obsconfig.h", which OBS only
          # generates into the build tree (configure_file -> config/).
          test -f obs-studio/build/config/obsconfig.h
          cp obs-studio/build/config/obsconfig.h "$OBS_INSTALL_PREFIX/include/obs/"
          # The build tree holds the same libraries in several places (real
          # outputs plus rundir copies/symlinks), so a flat cp -a of every
          # match dies on same-name collisions ("will not overwrite
          # just-created"). Copy each basename once, dereferencing symlinks
          # (-L) so the staged prefix is self-contained.
          mapfile -t LIBS < <(find obs-studio/build -name "libobs.so*" \( -type f -o -type l \))
          if [ "${#LIBS[@]}" -eq 0 ]; then
            echo "libobs.so not found in the OBS build tree"
            find obs-studio/build -maxdepth 3 -name "*.so*" | head -50
            exit 1
          fi
          declare -A SEEN_LIB
          for lib in "${LIBS[@]}"; do
            base="$(basename "$lib")"
            if [ -z "${SEEN_LIB[$base]:-}" ]; then
              SEEN_LIB[$base]=1
              cp -L "$lib" "$OBS_INSTALL_PREFIX/lib/"
            fi
          done
          test -e "$OBS_INSTALL_PREFIX/lib/libobs.so"
          echo "=== staged OBS SDK ==="
          find "$OBS_INSTALL_PREFIX/lib" -name "libobs*"

      - name: Configure Ojowacam OBS Plugin (Linux)
        run: |
          cmake -S apps/obs-plugin-linux -B apps/obs-plugin-linux/build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/obs-install"
          if [ $? -ne 0 ]; then exit 1; fi
          echo "Ojowacam plugin configure complete"

      - name: Build Ojowacam OBS Plugin (Linux)
        run: |
          cmake --build apps/obs-plugin-linux/build -j $(nproc)
          if [ $? -ne 0 ]; then exit 1; fi
          echo "Ojowacam plugin build complete"

      - name: Upload Linux OBS Plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-obs-linux
          if-no-files-found: error
          path: |
            apps/obs-plugin-linux/build/data/obs-plugins/ojowacam-obs/**/*.so*

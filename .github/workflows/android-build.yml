name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_VERSION: '17'

jobs:
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
          accept-android-sdk-licenses: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: |
          npm install
          cd apps/mobile && npm install
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > apps/mobile/android/ojowacam-upload-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/apps/mobile/android/ojowacam-upload-keystore.jks" >> $GITHUB_ENV
          fi
      - name: Android native modules present
        run: |
          echo "Android native modules exist at apps/mobile/android/"
          ls apps/mobile/android/src/main/java/com/ojowacam/mobile/
          echo "Building Android debug APK, release APK, and release AAB with Gradle 8.0..."
          sudo apt-get update && sudo apt-get install -y unzip zip
          cd apps/mobile/android && chmod +x gradlew && ./gradlew assembleDebug assembleRelease bundleRelease
      - name: Stage artifacts into publish folder
        run: |
          mkdir -p ci-output/apk-debug/publish ci-output/apk-release/publish ci-output/aab-release/publish
          # Debug APK (connects to Metro dev server — for development/testing)
          if [ -f apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk ci-output/apk-debug/publish/
          fi
          # Release APK (bundled JS, no Metro dependency — production artifact)
          if [ -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ci-output/apk-release/publish/
          fi
          # Release AAB (bundled JS, no Metro dependency — production artifact for Play Store)
          if [ -f apps/mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab ci-output/aab-release/publish/
          fi
          find ci-output -type f
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-apk-debug
          path: ci-output/apk-debug/
          if-no-files-found: error
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-apk-release
          path: ci-output/apk-release/
          if-no-files-found: error
      - name: Upload Android release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-aab-release
          path: ci-output/aab-release/
          if-no-files-found: error

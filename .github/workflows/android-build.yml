name: Android Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
  JAVA_VERSION: '17'

jobs:
  android-build:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11076708"
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 emulator system-images;android-34;google_apis;x86_64"
          licenses: " emulator,system-images;android-34;google_apis;x86_64"
          accept-android-sdk-licenses: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: |
          npm install
          cd apps/mobile && npm install
      - name: Android native modules present
        run: |
          echo "Android native modules exist at apps/mobile/android/"
          ls apps/mobile/android/src/main/java/com/ojowacam/mobile/
          echo "Building Android APK with Gradle 8.0..."
          sudo apt-get update && sudo apt-get install -y unzip zip
          cd apps/mobile/android && ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-apk
          path: apps/mobile/android/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > apps/mobile/android/ojowacam-upload-keystore.jks
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/apps/mobile/android/ojowacam-upload-keystore.jks" >> $GITHUB_ENV
          fi
      - name: Build Android release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            cd apps/mobile/android
            ./gradlew assembleRelease bundleRelease
          fi
      - name: Upload Android release APK
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-apk-release
          path: apps/mobile/android/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload Android AAB
        if: env.ANDROID_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: ojowacam-android-aab
          path: apps/mobile/android/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
